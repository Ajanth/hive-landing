<!doctype html>
<html lang="en" data-composition-id="note">
<head><meta charset="UTF-8" /><title>Hive Notes</title></head>
<body>
<template>
  <style>
    @font-face { font-family: "Geist"; src: url("assets/fonts/geist-latin-variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    * { box-sizing: border-box; }
    #root { position: absolute; inset: 0; overflow: hidden; color: #F3F2F5; background: #181818; font-family: "Geist", sans-serif; }
    .shot-stage { position: absolute; inset: 0; overflow: hidden; }
    .video-viewport { position: absolute; inset: 0 0 72px; overflow: hidden; background: #181818; }
    .camera-world { position: absolute; inset: 0; }
    .source-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .feature-label { position: absolute; left: 64px; bottom: 16px; margin: 0; color: #C7C5CD; font-size: 36px; font-weight: 500; line-height: 1.1; letter-spacing: -0.035em; }
  </style>
  <div data-hf-id="hf-lbg1" id="root" data-composition-id="note" data-width="1920" data-height="1080" data-duration="1.8" data-fps="60">
    <div data-hf-id="hf-i9b0" class="shot-stage" data-layout-allow-overflow>
      <div data-hf-id="hf-49el" class="video-viewport" data-layout-allow-overflow>
        <div data-hf-id="hf-uhlv" class="camera-world" data-layout-allow-overflow>
          <video data-hf-id="hf-g7k0" id="note-footage" class="clip source-video" data-start="0" data-duration="1.8" data-media-start="0" data-track-index="0" src="assets/montage/note.mp4" muted playsinline style="z-index:1"></video>
        </div>
      </div>
    </div>
    <h1 data-hf-id="hf-kyam" class="feature-label" data-var-text="note_label">Notes</h1>
  </div>
  <script>
    // Framing is editorial; the running state, messages, waveform and drop are recorded pixels.
    const root = document.getElementById("root");
    const world = root.querySelector(".camera-world");
    const stage = root.querySelector(".shot-stage");
    const label = root.querySelector(".feature-label");
    const tl = gsap.timeline({ paused: true });
    tl.set(world, { xPercent: 0, yPercent: 42.5, scale: 1.85 }, 0);
    tl.fromTo(stage, { x: -110 }, { x: 0, duration: 0.22, ease: "power4.out", immediateRender: false }, 0);
    tl.fromTo(label, { opacity: 0.5 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, 0);
    tl.to({}, { duration: 1.8 }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines["note"] = tl;
  </script>
</template>
</body>
</html>
