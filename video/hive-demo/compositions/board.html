<!doctype html>

<head><meta charset="UTF-8" /><title>Hive Board</title></head>

<template>
  <style>
    @font-face { font-family: "Geist"; src: url("assets/fonts/geist-latin-variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    * { box-sizing: border-box; }
    #root { position: absolute; inset: 0; overflow: hidden; color: #F3F2F5; background: #181818; font-family: "Geist", sans-serif; }
    .shot-stage { position: absolute; inset: 0; }
    .chapter-bar { position: absolute; inset: 0 0 auto; height: 96px; background: #181818; z-index: 2; }
    .chapter-label { position: absolute; left: 96px; top: 14px; margin: 0; color: #F3F2F5; font-size: 64px; font-weight: 530; line-height: 1.12; letter-spacing: -0.045em; }
    .chapter-copy { position: absolute; right: 96px; top: 32px; margin: 0; color: #B0ADB8; font-size: 30px; font-weight: 450; line-height: 1.2; letter-spacing: -0.02em; }
    .video-viewport { position: absolute; inset: 96px 0 0; overflow: hidden; background: #181818; }
    .camera-world { position: absolute; inset: 0; }
    .source-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  </style>
  <div data-hf-id="hf-fb7c" id="root" data-composition-id="board" data-width="1920" data-height="1080" data-duration="8.7" data-fps="30">
    <div data-hf-id="hf-1q1v" class="chapter-bar" data-layout-allow-overlap>
      <h1 data-hf-id="hf-r22s" class="chapter-label" data-var-text="board_label">Board</h1>
      <p data-hf-id="hf-cvvr" class="chapter-copy" data-var-text="board_strap">Give the work a place.</p>
    </div>
    <div data-hf-id="hf-1xrt" class="shot-stage">
      <div data-hf-id="hf-49el" class="video-viewport" data-layout-allow-overflow>
        <div data-hf-id="hf-1l1i" class="camera-world">
          <video data-hf-id="hf-lwyp" id="board-footage" class="clip source-video" data-start="0" data-duration="8.7" data-media-start="4.4" data-track-index="0" src="assets/recordings/board.mp4" muted playsinline style="z-index:1"></video>
        </div>
      </div>
    </div>
  </div>
  <script>
    // Camera geometry is adapted from Hyperframes' ui-focus-zoom primitive.
    // The recorded product keeps its own colors and motion; no filter or fake UI is added.
    const root = document.getElementById("root");
    const world = root.querySelector(".camera-world");
    const stage = root.querySelector(".shot-stage");
    const label = root.querySelector(".chapter-label");
    const copy = root.querySelector(".chapter-copy");
    const focus = (x, y, scale) => {
      const limit = 50 * (scale - 1);
      const clamp = value => Math.min(limit, Math.max(-limit, value));
      return { xPercent: clamp(-(x - 50) * scale), yPercent: clamp(-(y - 50) * scale), scale };
    };
    const overview = { xPercent: 0, yPercent: 0, scale: 1 };
    const firstFocus = focus(23, 33, 1.7);
    const secondFocus = focus(29, 43, 1.9);
    const tl = gsap.timeline({ paused: true });
    tl.set(world, overview, 0);
    tl.fromTo(stage, { x: 440, y: 0 }, { x: 0, y: 0, duration: 0.72, ease: "power4.out" }, 0);
    tl.fromTo(label, { opacity: 0.2 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 0);
    tl.fromTo(copy, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.1);
    tl.fromTo(world, overview, { ...firstFocus, duration: 0.72, ease: "power2.inOut", immediateRender: false }, 0.3);
    tl.fromTo(world, firstFocus, { ...secondFocus, duration: 0.65, ease: "power2.inOut", immediateRender: false }, 4.75);
    tl.fromTo(world, secondFocus, { ...overview, duration: 0.65, ease: "power2.inOut", immediateRender: false }, 7.2);
    tl.to(stage, { y: -130, duration: 0.33, ease: "power4.in" }, 8.37);
    window.__timelines = window.__timelines || {};
    window.__timelines["board"] = tl;
  </script>
</template>
</body>
</html>
