<!doctype html>
<html lang="en" data-composition-id="terminal">
<head><meta charset="UTF-8" /><title>Hive Terminal</title></head>
<body>
<template>
  <style>
    @font-face { font-family: "Geist"; src: url("assets/fonts/geist-latin-variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    * { box-sizing: border-box; }
    #root { position: absolute; inset: 0; overflow: hidden; color: #F3F2F5; background: #181818; font-family: "Geist", sans-serif; }
    .shot-stage { position: absolute; inset: 0; overflow: hidden; }
    .video-viewport { position: absolute; inset: 0 0 72px; overflow: hidden; background: #181818; }
    .camera-world { position: absolute; inset: 0; }
    .source-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .feature-label { position: absolute; left: 64px; bottom: 16px; margin: 0; color: #C7C5CD; font-size: 36px; font-weight: 500; line-height: 1.1; letter-spacing: -0.035em; }
  </style>
  <div data-hf-id="hf-i38q" id="root" data-composition-id="terminal" data-width="1920" data-height="1080" data-duration="2.933333333333333" data-fps="60">
    <div data-hf-id="hf-i9b0" class="shot-stage" data-layout-allow-overflow>
      <div data-hf-id="hf-49el" class="video-viewport" data-layout-allow-overflow>
        <div data-hf-id="hf-uhlv" class="camera-world" data-layout-allow-overflow>
          <video data-hf-id="hf-uf2r" id="terminal-footage" class="clip source-video" data-start="0" data-duration="2.933333333333333" data-media-start="0" data-track-index="0" src="assets/montage/terminal.mp4" muted playsinline style="z-index:1"></video>
        </div>
      </div>
    </div>
    <h1 data-hf-id="hf-bb01" class="feature-label" data-var-text="terminal_label">Terminal</h1>
  </div>
  <script>
    // The source keeps the full application. These seek-safe camera moves restore
    // the establish → focus → pullback language from the original product film.
    const root = document.getElementById("root");
    const world = root.querySelector(".camera-world");
    const label = root.querySelector(".feature-label");
    const overview = { xPercent: 0, yPercent: 0, scale: 1 };
    const focus = (x, y, scale) => {
      const limit = 50 * (scale - 1);
      const clamp = value => Math.min(limit, Math.max(-limit, value));
      return { xPercent: clamp(-(x - 50) * scale), yPercent: clamp(-(y - 50) * scale), scale };
    };
    const tl = gsap.timeline({ paused: true });
    tl.set(world, overview, 0);
    const closeView = focus(49, 49, 1.5);
    tl.fromTo(world, overview, { ...closeView, duration: 0.64, ease: "power2.inOut", immediateRender: false }, 0.24);
    tl.fromTo(world, closeView, { ...overview, duration: 0.64, ease: "power2.inOut", immediateRender: false }, 2.026666666667);
    tl.fromTo(label, { opacity: 0.5 }, { opacity: 1, duration: 0.16, ease: "power2.out" }, 0);
    tl.to({}, { duration: 2.933333333333 }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines["terminal"] = tl;
  </script>
</template>
</body>
</html>
